<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zombie Rescue — SunnyBeak Arcade</title>
<style>
:root{--bg:#071015;--card:#10202a;--ink:#f4f6d8;--muted:#9bb0a5;--gold:#ffcc44;--green:#5cff9d;--pink:#ff7bd5;--blue:#33aaff;--purple:#bb66ff;--border:rgba(255,204,68,.28)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#1d3940 0,#071015 58%,#030609 100%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);overflow:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:52px 52px}.shell{position:relative;z-index:1;height:100vh;display:grid;grid-template-columns:320px 1fr;grid-template-rows:78px 1fr;gap:14px;padding:16px}.topbar{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:12px}.brand{display:flex;gap:12px;align-items:center;color:var(--ink);text-decoration:none;font-weight:950;text-transform:uppercase}.mark{width:50px;height:50px;display:grid;place-items:center;border:2px solid var(--gold);border-radius:16px;background:#0b161d;box-shadow:0 0 22px rgba(255,204,68,.25);font-size:25px}.brand small{color:var(--muted);text-transform:none}.nav{display:flex;gap:10px;flex-wrap:wrap}.btn,.nav a{border:1.5px solid var(--border);border-radius:999px;background:rgba(16,32,42,.85);color:var(--ink);padding:10px 14px;text-decoration:none;font-weight:900;cursor:pointer;font-family:inherit}.btn:hover,.nav a:hover{border-color:var(--gold);color:var(--gold);box-shadow:0 0 18px rgba(255,204,68,.18)}.side{display:flex;flex-direction:column;gap:12px;min-width:0}.panel{border:1.5px solid var(--border);border-radius:18px;background:linear-gradient(180deg,rgba(16,32,42,.94),rgba(5,10,14,.9));padding:14px;box-shadow:0 12px 32px rgba(0,0,0,.55)}.panel h2{margin:0 0 10px;color:var(--gold);font-size:14px;letter-spacing:.14em;text-transform:uppercase}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.04);padding:9px;text-align:center}.stat b{display:block;font-size:24px;color:var(--gold)}.stat span{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}.gadget{border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:10px;background:rgba(255,255,255,.04);display:grid;gap:6px;margin-bottom:8px}.gadget.active{border-color:var(--green);box-shadow:0 0 14px rgba(92,255,157,.18)}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.gadget strong{font-size:15px}.gadget small{color:var(--muted);font-weight:750}.mini{font-size:12px;padding:7px 9px}.gamewrap{position:relative;border:1.5px solid var(--border);border-radius:22px;overflow:hidden;background:#112219;box-shadow:0 14px 45px rgba(0,0,0,.7)}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;display:none;place-items:center;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:3}.overlay.show{display:grid}.card{width:min(680px,90%);border:1.5px solid var(--gold);border-radius:28px;background:#0b161d;padding:34px;text-align:center;box-shadow:0 0 70px rgba(255,204,68,.25)}.card h1{font-size:clamp(38px,7vw,76px);margin:0 0 10px;color:var(--gold);letter-spacing:-.05em}.card p{font-size:18px;color:var(--muted);font-weight:700}.objectives{display:grid;gap:7px;color:var(--muted);font-weight:800}.obj.ok{color:var(--green)}.log{height:120px;overflow:auto;font-family:ui-monospace,monospace;color:#cfe7d7;font-size:12px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(0,0,0,.22);padding:8px}.kbd{display:flex;gap:7px;flex-wrap:wrap}.key{border:1px solid rgba(255,204,68,.35);border-radius:8px;padding:6px 8px;background:rgba(0,0,0,.25);font-family:ui-monospace,monospace;font-size:12px;color:#ffe08a}@media(max-width:980px){body{overflow:auto}.shell{height:auto;min-height:100vh;grid-template-columns:1fr;grid-template-rows:auto auto auto}.topbar{grid-column:1;align-items:flex-start;flex-direction:column}.gamewrap{height:72vh}.side{order:2}}
</style></head><body><main class="shell"><header class="topbar"><a class="brand" href="../../index.html"><span class="mark">🧟</span><span>Zombie Rescue<br><small>SunnyBeak Arcade</small></span></a><nav class="nav"><a href="../../index.html">Home</a><a href="../mystic-cube/index.html">Mystic Cube</a><a href="../beat-maker/index.html">Beat Maker</a><a href="../../games/dino-dash/index.html">Dino Dash</a></nav></header><aside class="side"><section class="panel"><h2>Run</h2><div class="statgrid"><div class="stat"><b id="score">0</b><span>Score</span></div><div class="stat"><b id="coins">0</b><span>Coins</span></div><div class="stat"><b id="wave">1</b><span>Wave</span></div><div class="stat"><b id="hp">100</b><span>Joy</span></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button class="btn" id="startBtn">Start</button><button class="btn" id="resetBtn">Reset Save</button></div></section><section class="panel"><h2>Gadget Bag</h2><div id="gadgets"></div></section><section class="panel"><h2>Objectives</h2><div class="objectives" id="objectives"></div></section><section class="panel"><h2>Move Log</h2><div class="log" id="log"></div><div class="kbd" style="margin-top:10px"><span class="key">WASD move</span><span class="key">Mouse aim</span><span class="key">Click sparkle</span><span class="key">E bird call</span></div></section></aside><section class="gamewrap"><canvas id="game" width="1100" height="720"></canvas><div class="overlay show" id="menu"><div class="card"><h1>Zombie Rescue</h1><p>Rescue friends, collect coins, feed SunnyBeak and upgrade sparkle gadgets.</p><button class="btn" onclick="startGame()">PLAY</button></div></div></section></main><script>
const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height,key='nara_zombie_rescue';const data={sun:{name:'Sun Pop',icon:'☀️',cost:0,power:20,rate:250,speed:13,color:'#ffcc44'},rain:{name:'Rainbow Rattle',icon:'🌈',cost:220,power:12,rate:95,speed:15,color:'#33aaff'},star:{name:'Star Scatter',icon:'⭐',cost:420,power:14,rate:520,speed:11,color:'#ff8844',spread:5},leaf:{name:'Leaf Calm',icon:'🍃',cost:620,power:9,rate:160,speed:9,color:'#5cff9d'},moon:{name:'Moon Boom',icon:'🌙',cost:850,power:38,rate:760,speed:10,color:'#bb66ff',wide:true}};let save=load(),p,sparks=[],zeds=[],friends=[],food=[],bits=[],keys={},m={x:W/2,y:H/2,down:false},run=false,last=0,wave=1,score=0,rescue=0,feed=0,calm=0,timer=0;function load(){try{return JSON.parse(localStorage.getItem(key))||{coins:0,open:['sun'],tiers:{sun:1},active:'sun'}}catch{return{coins:0,open:['sun'],tiers:{sun:1},active:'sun'}}}function saveIt(){localStorage.setItem(key,JSON.stringify(save))}function log(s){let d=document.createElement('div');d.textContent=s;document.getElementById('log').prepend(d)}function resetSave(){save={coins:0,open:['sun'],tiers:{sun:1},active:'sun'};saveIt();drawBag();log('save reset')}function drawBag(){document.getElementById('coins').textContent=save.coins;let box=document.getElementById('gadgets');box.innerHTML='';Object.entries(data).forEach(([id,g])=>{let open=save.open.includes(id),tier=save.tiers[id]||1,cost=open?100*tier:g.cost;box.innerHTML+=`<div class="gadget ${save.active===id?'active':''}"><div class="row"><strong>${g.icon} ${g.name}</strong><small>T${tier}</small></div><small>${open?'Upgrade':'Unlock'} ${cost} coins</small><div class="row"><button class="btn mini" onclick="equip('${id}')" ${!open?'disabled':''}>Use</button><button class="btn mini" onclick="buy('${id}')">${open?'Upgrade':'Unlock'}</button></div></div>`})}function equip(id){if(save.open.includes(id)){save.active=id;saveIt();drawBag();log('using '+data[id].name)}}function buy(id){let g=data[id],open=save.open.includes(id),tier=save.tiers[id]||1,cost=open?100*tier:g.cost;if(save.coins<cost){log('need more coins');return}save.coins-=cost;if(open)save.tiers[id]=Math.min(5,tier+1);else{save.open.push(id);save.tiers[id]=1;save.active=id}saveIt();drawBag();log((open?'upgraded ':'unlocked ')+g.name)}function startGame(){document.getElementById('menu').classList.remove('show');run=true;score=0;wave=1;calm=0;rescue=0;feed=0;sparks=[];zeds=[];bits=[];p={x:W/2,y:H/2,joy:100};friends=Array.from({length:4},()=>({x:80+Math.random()*(W-160),y:80+Math.random()*(H-160),ok:false}));food=Array.from({length:6},()=>({x:60+Math.random()*(W-120),y:60+Math.random()*(H-120),ok:false}));log('run started');loop()}function spawn(){let side=Math.floor(Math.random()*4),zx=side<2?Math.random()*W:(side===2?-20:W+20),zy=side>=2?Math.random()*H:(side===0?-20:H+20),fast=Math.random()<.16+wave*.012,big=Math.random()<.08+wave*.01;zeds.push({x:zx,y:zy,calm:big?86:fast?32:48,max:big?86:fast?32:48,r:big?22:15,s:fast?1.8:big?.72:1.05,big,fast})}function sparkle(){let g=data[save.active],tier=save.tiers[save.active]||1,now=performance.now();if(now-last<g.rate*(1-.08*(tier-1)))return;last=now;let a=Math.atan2(m.y-p.y,m.x-p.x),n=g.spread||1;for(let i=0;i<n;i++){let aa=a+(i-(n-1)/2)*.16;sparks.push({x:p.x,y:p.y,vx:Math.cos(aa)*g.speed,vy:Math.sin(aa)*g.speed,p:g.power*(1+.2*(tier-1)),life:80,c:g.color,wide:g.wide})}}function update(){if(!run)return;let sp=3.3;if(keys.w||keys.ArrowUp)p.y-=sp;if(keys.s||keys.ArrowDown)p.y+=sp;if(keys.a||keys.ArrowLeft)p.x-=sp;if(keys.d||keys.ArrowRight)p.x+=sp;p.x=Math.max(18,Math.min(W-18,p.x));p.y=Math.max(18,Math.min(H-18,p.y));if(m.down)sparkle();if(--timer<=0){spawn();timer=Math.max(18,70-wave*3)}sparks.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.life--});sparks=sparks.filter(s=>s.life>0&&s.x>-40&&s.y>-40&&s.x<W+40&&s.y<H+40);zeds.forEach(z=>{let a=Math.atan2(p.y-z.y,p.x-z.x);z.x+=Math.cos(a)*z.s;z.y+=Math.sin(a)*z.s;if(Math.hypot(p.x-z.x,p.y-z.y)<z.r+14)p.joy-=.15+wave*.02});for(let s of sparks){for(let z of zeds){if(z.calm>0&&Math.hypot(s.x-z.x,s.y-z.y)<z.r+5){z.calm-=s.p;s.life=0;if(s.wide){for(let q of zeds)if(Math.hypot(q.x-z.x,q.y-z.y)<70)q.calm-=s.p*.45}for(let i=0;i<4;i++)bits.push({x:z.x,y:z.y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,c:s.c,life:22});break}}}let done=zeds.filter(z=>z.calm<=0);done.forEach(z=>{calm++;score+=z.big?80:30;save.coins+=z.big?25:7});if(done.length)saveIt();zeds=zeds.filter(z=>z.calm>0);friends.forEach(f=>{if(!f.ok&&Math.hypot(p.x-f.x,p.y-f.y)<30){f.ok=true;rescue++;score+=120;save.coins+=20;log('friend rescued +20 coins');saveIt()}});food.forEach(f=>{if(!f.ok&&Math.hypot(p.x-f.x,p.y-f.y)<26){f.ok=true;feed++;p.joy=Math.min(100,p.joy+18);score+=80;save.coins+=30;log('SunnyBeak fed +30 coins');saveIt()}});bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.life--});bits=bits.filter(b=>b.life>0);if(p.joy<=0)end();if(calm>=20&&rescue>=3&&feed>=1){wave++;calm=0;rescue=0;feed=0;score+=250;save.coins+=150;saveIt();friends.forEach(f=>f.ok=false);food.forEach(f=>f.ok=false);log('wave clear +150 coins')}}function stats(){document.getElementById('score').textContent=score;document.getElementById('wave').textContent=wave;document.getElementById('hp').textContent=Math.max(0,Math.floor(p?.joy||100));document.getElementById('objectives').innerHTML=`<div class="obj ${rescue>=3?'ok':''}">🧑 Rescue friends: ${rescue}/3</div><div class="obj ${calm>=20?'ok':''}">🧟 Calm zombies: ${calm}/20</div><div class="obj ${feed>=1?'ok':''}">🐦 Feed SunnyBeak: ${feed}/1</div>`}function draw(){x.fillStyle='#142719';x.fillRect(0,0,W,H);x.strokeStyle='rgba(255,255,255,.05)';for(let gx=0;gx<W;gx+=50){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,H);x.stroke()}for(let gy=0;gy<H;gy+=50){x.beginPath();x.moveTo(0,gy);x.lineTo(W,gy);x.stroke()}food.forEach(f=>{if(!f.ok){x.font='24px serif';x.fillText('🌽',f.x-12,f.y+9)}});friends.forEach(f=>{if(!f.ok){x.font='28px serif';x.fillText('🧑',f.x-14,f.y+11)}});zeds.forEach(z=>{x.beginPath();x.fillStyle=z.big?'#7a42ff':z.fast?'#ff6655':'#5fa35d';x.arc(z.x,z.y,z.r,0,Math.PI*2);x.fill();x.font='18px serif';x.fillText('🧟',z.x-12,z.y+7);x.fillStyle='#111';x.fillRect(z.x-z.r,z.y-z.r-10,z.r*2,4);x.fillStyle='#5cff9d';x.fillRect(z.x-z.r,z.y-z.r-10,z.r*2*(z.calm/z.max),4)});sparks.forEach(s=>{x.beginPath();x.fillStyle=s.c;x.shadowBlur=14;x.shadowColor=s.c;x.arc(s.x,s.y,5,0,Math.PI*2);x.fill();x.shadowBlur=0});bits.forEach(b=>{x.globalAlpha=b.life/22;x.fillStyle=b.c;x.fillRect(b.x,b.y,4,4);x.globalAlpha=1});if(p){x.save();x.translate(p.x,p.y);x.rotate(Math.atan2(m.y-p.y,m.x-p.x));x.fillStyle='#f4f6d8';x.beginPath();x.arc(0,0,15,0,Math.PI*2);x.fill();x.fillStyle='#ffcc44';x.fillRect(4,-4,24,8);x.restore();x.font='24px serif';x.fillText('🐦',p.x-12,p.y-30)}x.fillStyle='rgba(0,0,0,.34)';x.fillRect(18,18,230,54);x.fillStyle='#ff7bd5';x.fillRect(30,35,180*(p?p.joy/100:1),12);x.strokeStyle='#fff';x.strokeRect(30,35,180,12);x.fillStyle='#fff';x.font='bold 14px system-ui';x.fillText('SunnyBeak squad online',30,68)}function loop(){update();draw();stats();drawBag();if(run)requestAnimationFrame(loop)}function end(){run=false;document.getElementById('menu').classList.add('show');document.querySelector('#menu h1').textContent='Rest Time';document.querySelector('#menu p').textContent='Score '+score+' · Coins saved '+save.coins;drawBag()}
c.addEventListener('mousemove',e=>{let r=c.getBoundingClientRect();m.x=(e.clientX-r.left)/r.width*W;m.y=(e.clientY-r.top)/r.height*H});c.addEventListener('mousedown',()=>m.down=true);window.addEventListener('mouseup',()=>m.down=false);window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.toLowerCase()==='e'){feed++;if(p)p.joy=Math.min(100,p.joy+8);log('SunnyBeak call')}});window.addEventListener('keyup',e=>keys[e.key]=false);document.getElementById('startBtn').onclick=startGame;document.getElementById('resetBtn').onclick=resetSave;drawBag();stats();draw();
</script></body></html>
