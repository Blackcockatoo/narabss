<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake Trail — Nara's Colour Quest</title>
  <style>
    :root{--paper:#080612;--card:#13102a;--ink:#e8d4b8;--ink-dim:#7a6a8a;
      --border:rgba(100,70,220,0.28);--blue:#33aaff;--gold:#ffcc44;--purple:#bb66ff;--moss:#44dd88}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100vh;background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif}
    .shell{max-width:700px;margin:0 auto;padding:20px 16px 48px}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 0 18px}
    .brand{text-decoration:none;font-weight:900;color:var(--blue);font-size:13px}
    .kicker{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--blue);text-transform:uppercase;margin-bottom:6px}
    h1{font-size:clamp(30px,6vw,58px);letter-spacing:-.06em;line-height:.9;margin-bottom:14px}
    .score-row{display:flex;gap:20px;margin-bottom:12px;font-weight:800;font-size:15px;color:var(--ink-dim)}
    .score-row b{color:var(--gold)}
    .game-wrap{position:relative;border:1.5px solid var(--border);border-radius:18px;overflow:hidden;
      box-shadow:0 0 40px rgba(0,0,0,.8)}
    canvas{display:block;width:100%;height:auto}
    .overlay{position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:14px;background:rgba(8,6,18,.88)}
    .overlay h2{font-size:clamp(26px,5vw,48px);letter-spacing:-.05em;color:var(--blue);
      text-shadow:0 0 30px rgba(51,170,255,.6)}
    .overlay p{color:var(--ink-dim);font-weight:700;font-size:14px;text-align:center}
    .btn{padding:12px 28px;border-radius:999px;border:1.5px solid var(--blue);
      background:rgba(51,170,255,.1);color:var(--blue);font-weight:900;cursor:pointer;
      font-size:15px;font-family:inherit;transition:box-shadow .15s}
    .btn:hover{box-shadow:0 0 22px rgba(51,170,255,.5)}
    .controls{text-align:center;margin-top:12px;font-size:13px;color:var(--ink-dim);font-weight:700}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="../../index.html">← Home</a>
    </header>
    <p class="kicker">Baby B$S · Snake Game</p>
    <h1>Snake Trail</h1>
    <div class="score-row">
      <span>Length <b id="scoreDisplay">3</b></span>
      <span>Pellets <b id="pelletsDisplay">0</b></span>
      <span>Best <b id="bestDisplay">3</b></span>
    </div>
    <div class="game-wrap">
      <canvas id="c" width="560" height="560"></canvas>
      <div class="overlay" id="overlay">
        <h2>🐍 Snake Trail</h2>
        <p>Eat pellets to grow · Walls wrap around<br>Arrow keys · WASD · Swipe</p>
        <button class="btn" onclick="startGame()">▶ Start Slithering</button>
      </div>
    </div>
    <p class="controls">Arrow keys or WASD to turn · Swipe on mobile</p>
  </div>
  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    const SIZE=28, COLS=20, ROWS=20, W=SIZE*COLS, H=SIZE*ROWS;
    c.width=W; c.height=H;

    let snake, dir, nextDir, pellets, running, best=3, frame, interval;
    const COLORS=['#33aaff','#bb66ff','#44dd88','#ffcc44','#ff8844'];

    function init() {
      snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
      dir={x:1,y:0}; nextDir={x:1,y:0};
      pellets=[]; frame=0;
      spawnPellets(4);
      document.getElementById('scoreDisplay').textContent=3;
      document.getElementById('pelletsDisplay').textContent=0;
    }

    function spawnPellets(n=1) {
      for(let i=0;i<n;i++){
        let p;
        do { p={x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS),
               color:COLORS[Math.floor(Math.random()*COLORS.length)]}; }
        while (snake.some(s=>s.x===p.x&&s.y===p.y) || pellets.some(pp=>pp.x===p.x&&pp.y===p.y));
        pellets.push(p);
      }
    }

    function startGame() {
      document.getElementById('overlay').style.display='none';
      clearInterval(interval);
      init(); running=true;
      interval = setInterval(step, 130);
    }

    function step() {
      if (!running) return;
      dir = {...nextDir};
      const head = { x: (snake[0].x + dir.x + COLS) % COLS, y: (snake[0].y + dir.y + ROWS) % ROWS };

      // Self collision
      if (snake.some(s=>s.x===head.x&&s.y===head.y)) { gameOver(); return; }

      snake.unshift(head);

      // Eat pellet?
      const pi = pellets.findIndex(p=>p.x===head.x&&p.y===head.y);
      if (pi >= 0) {
        pellets.splice(pi,1);
        const pelletsEaten = parseInt(document.getElementById('pelletsDisplay').textContent)+1;
        document.getElementById('pelletsDisplay').textContent=pelletsEaten;
        spawnPellets(1);
      } else {
        snake.pop();
      }

      document.getElementById('scoreDisplay').textContent=snake.length;
      if (snake.length > best) { best=snake.length; document.getElementById('bestDisplay').textContent=best; }
      draw();
    }

    // Controls
    const DIRS={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},
      w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};
    document.addEventListener('keydown', e=>{
      const d = DIRS[e.key];
      if (d && !(d.x===-dir.x && d.y===-dir.y)) { nextDir=d; e.preventDefault(); }
    });

    // Swipe
    let touchStart=null;
    c.addEventListener('touchstart', e=>{ touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}; });
    c.addEventListener('touchend', e=>{
      if (!touchStart) return;
      const dx=e.changedTouches[0].clientX-touchStart.x;
      const dy=e.changedTouches[0].clientY-touchStart.y;
      if (Math.abs(dx)>Math.abs(dy)) nextDir=dx>0?{x:1,y:0}:{x:-1,y:0};
      else nextDir=dy>0?{x:0,y:1}:{x:0,y:-1};
      if(nextDir.x===-dir.x&&nextDir.y===-dir.y) nextDir={...dir};
      touchStart=null;
    });

    function draw() {
      ctx.clearRect(0,0,W,H);
      // Grid bg
      ctx.fillStyle='#0a0816'; ctx.fillRect(0,0,W,H);
      for(let x=0;x<COLS;x++) for(let y=0;y<ROWS;y++){
        if((x+y)%2===0){ ctx.fillStyle='rgba(255,255,255,0.015)'; ctx.fillRect(x*SIZE,y*SIZE,SIZE,SIZE); }
      }

      // Pellets
      pellets.forEach(p=>{
        ctx.beginPath(); ctx.arc(p.x*SIZE+SIZE/2, p.y*SIZE+SIZE/2, SIZE*.35, 0, Math.PI*2);
        ctx.fillStyle=p.color;
        ctx.shadowColor=p.color; ctx.shadowBlur=12;
        ctx.fill(); ctx.shadowBlur=0;
      });

      // Snake trail glow
      snake.forEach((s,i)=>{
        const t = 1 - i/snake.length;
        const alpha = 0.2 + t*0.8;
        ctx.fillStyle = `rgba(51,170,255,${alpha})`;
        ctx.shadowColor='#33aaff'; ctx.shadowBlur=i===0?18:6;
        const pad = i===0 ? 2 : 4;
        ctx.beginPath();
        ctx.roundRect(s.x*SIZE+pad, s.y*SIZE+pad, SIZE-pad*2, SIZE-pad*2, 6);
        ctx.fill();
      });
      ctx.shadowBlur=0;
    }

    draw();
    function gameOver() {
      running=false; clearInterval(interval);
      const ov=document.getElementById('overlay');
      ov.style.display='flex';
      ov.innerHTML=`<h2>🐍 Oops!</h2>
        <p>Length: <b style="color:var(--gold)">${snake.length}</b> · Best: <b style="color:var(--blue)">${best}</b></p>
        <button class="btn" onclick="startGame()">▶ Slither Again</button>`;
    }
  </script>
</body>
</html>
