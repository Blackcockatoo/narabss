<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catchemall Cat — Nara's Colour Quest</title>
  <style>
    :root{--paper:#080612;--card:#13102a;--ink:#e8d4b8;--ink-dim:#7a6a8a;
      --border:rgba(100,70,220,0.28);--blue:#33aaff;--gold:#ffcc44;--purple:#bb66ff;--orange:#ff8844}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100vh;background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif}
    .shell{max-width:760px;margin:0 auto;padding:20px 16px 48px}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 0 18px}
    .brand{text-decoration:none;font-weight:900;color:var(--blue);font-size:13px}
    .kicker{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--orange);text-transform:uppercase;margin-bottom:6px}
    h1{font-size:clamp(30px,6vw,58px);letter-spacing:-.06em;line-height:.9;margin-bottom:14px}
    .score-row{display:flex;gap:20px;margin-bottom:12px;font-weight:800;font-size:15px;color:var(--ink-dim)}
    .score-row b{color:var(--gold)}
    .game-wrap{position:relative;border:1.5px solid var(--border);border-radius:18px;overflow:hidden;
      background:var(--card);box-shadow:0 0 40px rgba(0,0,0,.8);touch-action:none}
    canvas{display:block;width:100%;height:auto}
    .overlay{position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:14px;background:rgba(8,6,18,.85)}
    .overlay h2{font-size:clamp(26px,5vw,48px);letter-spacing:-.05em;color:var(--orange);
      text-shadow:0 0 24px rgba(255,136,68,.5)}
    .overlay p{color:var(--ink-dim);font-weight:700;font-size:14px;text-align:center}
    .btn{padding:12px 28px;border-radius:999px;border:1.5px solid var(--orange);
      background:rgba(255,136,68,.1);color:var(--orange);font-weight:900;cursor:pointer;
      font-size:15px;font-family:inherit;transition:box-shadow .15s}
    .btn:hover{box-shadow:0 0 20px rgba(255,136,68,.5)}
    .controls{text-align:center;margin-top:12px;font-size:13px;color:var(--ink-dim);font-weight:700}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="../../index.html">← Home</a>
    </header>
    <p class="kicker">Baby B$S · Catch Game</p>
    <h1>Catchemall Cat</h1>
    <div class="score-row">
      <span>Caught <b id="scoreDisplay">0</b></span>
      <span>Hearts <b id="heartsDisplay">0</b></span>
      <span>Stars <b id="starsDisplay">0</b></span>
    </div>
    <div class="game-wrap">
      <canvas id="c" width="700" height="420"></canvas>
      <div class="overlay" id="overlay">
        <h2>🐱 Catchemall Cat</h2>
        <p>Move the cat to catch everything!<br>Mouse · Arrows · Touch</p>
        <button class="btn" onclick="startGame()">▶ Start Catching</button>
      </div>
    </div>
    <p class="controls">Move with mouse or arrow keys · Touch to play on mobile</p>
  </div>
  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    const W=700, H=420;
    const CAT_W=64, CAT_H=56, FLOOR=H-30;

    let cat, items, particles, score, hearts, stars, frame, running, targetX;
    const FALLING = ['❤️','🧶','⭐','🌸','🪶','💜'];

    function init() {
      cat={x:W/2-CAT_W/2, vx:0};
      items=[]; particles=[]; score=0; hearts=0; stars=0; frame=0; targetX=W/2;
      document.getElementById('scoreDisplay').textContent=0;
      document.getElementById('heartsDisplay').textContent=0;
      document.getElementById('starsDisplay').textContent=0;
    }

    function startGame() {
      document.getElementById('overlay').style.display='none';
      init(); running=true; requestAnimationFrame(loop);
    }

    // Controls
    const keys={};
    document.addEventListener('keydown', e=>{
      keys[e.key]=true;
      if(e.key==='ArrowLeft'||e.key==='ArrowRight') e.preventDefault();
    });
    document.addEventListener('keyup', e=>{ keys[e.key]=false; });
    c.addEventListener('mousemove', e=>{
      const r=c.getBoundingClientRect();
      targetX=(e.clientX-r.left)*(W/r.width)-CAT_W/2;
    });
    c.addEventListener('touchmove', e=>{
      e.preventDefault();
      const r=c.getBoundingClientRect();
      targetX=(e.touches[0].clientX-r.left)*(W/r.width)-CAT_W/2;
    },{passive:false});
    c.addEventListener('click', startGame);

    function loop() {
      if (!running) return;
      frame++;
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function update() {
      // Arrow key control
      if (keys['ArrowLeft']) targetX -= 8;
      if (keys['ArrowRight']) targetX += 8;
      targetX = Math.max(0, Math.min(W-CAT_W, targetX));

      // Smooth cat movement
      cat.x += (targetX - cat.x) * 0.18;
      cat.x = Math.max(0, Math.min(W-CAT_W, cat.x));

      // Spawn items
      if (frame % 48 === 0) {
        const emoji = FALLING[Math.floor(Math.random()*FALLING.length)];
        items.push({x:20+Math.random()*(W-40), y:-20, vy:2+Math.random()*2, emoji, r:18});
      }

      // Move items & check catch
      items = items.filter(it => {
        it.y += it.vy;
        // Check catch
        if (it.y + it.r > FLOOR - CAT_H &&
            it.x > cat.x - 10 && it.x < cat.x + CAT_W + 10) {
          score++;
          if (it.emoji==='❤️') hearts++;
          if (it.emoji==='⭐') stars++;
          document.getElementById('scoreDisplay').textContent=score;
          document.getElementById('heartsDisplay').textContent=hearts;
          document.getElementById('starsDisplay').textContent=stars;
          for(let i=0;i<10;i++) particles.push({
            x:it.x,y:it.y,vx:(Math.random()-.5)*6,vy:(Math.random()-1)*6,
            r:5+Math.random()*5,color:['#ffcc44','#33aaff','#bb66ff','#ff8844'][Math.floor(Math.random()*4)],life:35
          });
          return false;
        }
        // Miss (fall off bottom, no penalty)
        return it.y < H + 30;
      });

      // Particles
      particles = particles.filter(p=>{ p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;p.r*=0.93; return p.life>0; });
    }

    function draw() {
      ctx.clearRect(0,0,W,H);
      // Background
      const bg=ctx.createLinearGradient(0,0,0,H);
      bg.addColorStop(0,'#0c0818');bg.addColorStop(1,'#13102a');
      ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

      // Floor
      ctx.fillStyle='rgba(26,21,56,0.8)'; ctx.fillRect(0,FLOOR,W,H-FLOOR);
      ctx.strokeStyle='rgba(187,102,255,0.3)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(0,FLOOR); ctx.lineTo(W,FLOOR); ctx.stroke();

      // Stars bg
      ctx.fillStyle='rgba(255,255,255,0.4)';
      [40,120,200,350,480,620,80,290,530].forEach((x,i)=>{
        ctx.beginPath(); ctx.arc(x,(i%5)*30+5,1,0,Math.PI*2); ctx.fill();
      });

      // Falling items
      items.forEach(it=>{
        ctx.font='32px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.shadowColor='rgba(255,204,68,0.4)'; ctx.shadowBlur=10;
        ctx.fillText(it.emoji, it.x, it.y);
        ctx.shadowBlur=0;
      });

      // Particles
      particles.forEach(p=>{
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=p.color+'bb'; ctx.fill();
      });

      // Cat
      ctx.font=`${CAT_H}px serif`; ctx.textAlign='center'; ctx.textBaseline='bottom';
      ctx.shadowColor='rgba(255,136,68,0.5)'; ctx.shadowBlur=18;
      ctx.fillText('🐱', cat.x+CAT_W/2, FLOOR);
      ctx.shadowBlur=0;

      // Score pulse on collect
      ctx.textAlign='left'; ctx.font='bold 14px system-ui';
      ctx.fillStyle='rgba(255,204,68,0.6)';
      ctx.fillText(`✦ ${score} caught`, 10, 24);
    }
  </script>
</body>
</html>
