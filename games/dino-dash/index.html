<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dino Dash — Nara's Colour Quest</title>
  <style>
    :root{--paper:#080612;--card:#13102a;--ink:#e8d4b8;--ink-dim:#7a6a8a;
      --border:rgba(100,70,220,0.28);--blue:#33aaff;--gold:#ffcc44;--purple:#bb66ff;--moss:#44dd88;--orange:#ff8844}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100vh;background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif;overflow-x:hidden}
    .shell{max-width:860px;margin:0 auto;padding:20px 16px 48px}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 0 20px}
    .brand{text-decoration:none;font-weight:900;color:var(--blue);font-size:13px}
    .kicker{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
    h1{font-size:clamp(32px,7vw,64px);letter-spacing:-.06em;line-height:.9;margin-bottom:14px}
    .score-row{display:flex;gap:20px;margin-bottom:12px;font-weight:800;font-size:15px;color:var(--ink-dim)}
    .score-row b{color:var(--gold)}
    .game-wrap{position:relative;border:1.5px solid var(--border);border-radius:18px;overflow:hidden;
      background:var(--card);box-shadow:0 0 40px rgba(0,0,0,.8)}
    canvas{display:block;width:100%;height:auto}
    .overlay{position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:16px;background:rgba(8,6,18,.85)}
    .overlay h2{font-size:clamp(28px,6vw,52px);letter-spacing:-.05em;color:var(--gold);
      text-shadow:0 0 30px rgba(255,204,68,.5)}
    .overlay p{color:var(--ink-dim);font-weight:700;font-size:15px;text-align:center}
    .btn{padding:14px 32px;border-radius:999px;border:1.5px solid var(--blue);
      background:rgba(51,170,255,.1);color:var(--blue);font-weight:900;cursor:pointer;
      font-size:16px;font-family:inherit;transition:box-shadow .15s}
    .btn:hover{box-shadow:0 0 24px rgba(51,170,255,.5)}
    .controls{text-align:center;margin-top:12px;font-size:13px;color:var(--ink-dim);font-weight:700}
    .jump-btn{display:block;width:100%;margin-top:12px;font-size:18px;letter-spacing:.04em;
      min-height:64px;background:rgba(51,170,255,.12);border-color:var(--blue);color:var(--blue)}
    .jump-btn:active{background:rgba(51,170,255,.3)}
  </style>
  <link rel="stylesheet" href="../../css/game.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="../../index.html">← Home</a>
    </header>
    <p class="kicker">Baby B$S · Endless Runner</p>
    <h1>Dino Dash</h1>
    <div class="score-row">
      <span>Score <b id="scoreDisplay">0</b></span>
      <span>Drops <b id="dropsDisplay">0</b></span>
      <span>Best <b id="bestDisplay">0</b></span>
    </div>
    <div class="game-wrap">
      <canvas id="c" width="800" height="240"></canvas>
      <div class="overlay" id="overlay">
        <h2>🦖 Dino Dash</h2>
        <p>Jump over rocks · Collect colour drops<br>Spacebar, click or tap to jump</p>
        <button class="btn" id="startBtn">▶ Start Running</button>
      </div>
    </div>
    <button class="btn jump-btn" id="jumpBtn" aria-label="Jump">⬆ Jump</button>
    <p class="controls">Space · Click · Tap to jump · Double-jump allowed</p>
  </div>
  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    const W = 800, H = 240, GROUND = H - 44;

    let score=0, drops=0, best=0, speed=4, frame=0, running=false;
    let dino, obstacles, colorDrops, particles;

    function init() {
      dino = { x:90, y:GROUND, w:36, h:40, vy:0, jumps:0, onGround:true };
      obstacles = [];
      colorDrops = [];
      particles = [];
      score=0; drops=0; speed=4; frame=0;
    }

    const DROPS = ['#33aaff','#ffcc44','#bb66ff','#44dd88','#ff8844','#ff6688'];

    function spawnObstacle() {
      const h = 28 + Math.random() * 22;
      obstacles.push({ x:W+20, y:GROUND+dino.h-h, w:22, h, spd:speed });
    }
    function spawnDrop() {
      colorDrops.push({ x:W+20, y:GROUND - 50 - Math.random()*60, r:9, color:DROPS[Math.floor(Math.random()*DROPS.length)], spd:speed });
    }

    function jump() {
      if (!running) return;
      if (dino.jumps < 2) { dino.vy = -11; dino.jumps++; dino.onGround=false; }
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.addEventListener('keydown', e => { if(e.code==='Space'){e.preventDefault();jump();} });
    c.addEventListener('click', jump);
    c.addEventListener('touchstart', e=>{ e.preventDefault(); jump(); }, {passive:false});
    document.getElementById('jumpBtn').addEventListener('pointerdown', e=>{ e.preventDefault(); jump(); });

    function startGame() {
      document.getElementById('overlay').style.display='none';
      init(); running=true; requestAnimationFrame(loop);
    }

    function loop() {
      if (!running) return;
      frame++;
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function update() {
      // Speed ramp
      speed = 4 + score * 0.003;

      // Dino physics
      dino.vy += 0.6;
      dino.y += dino.vy;
      if (dino.y >= GROUND) { dino.y=GROUND; dino.vy=0; dino.jumps=0; dino.onGround=true; }

      // Spawn
      if (frame % Math.max(55, 100 - score*0.05 | 0) === 0) spawnObstacle();
      if (frame % 80 === 0) spawnDrop();

      // Move obstacles
      obstacles = obstacles.filter(o => {
        o.x -= speed;
        // Collision
        if (rectsOverlap(dino, o)) { gameOver(); return false; }
        return o.x > -40;
      });

      // Move drops
      colorDrops = colorDrops.filter(d => {
        d.x -= speed;
        if (Math.hypot(d.x-(dino.x+dino.w/2), d.y-(dino.y-dino.h/2)) < d.r+18) {
          drops++; score+=5;
          for(let i=0;i<8;i++) particles.push({x:d.x,y:d.y,vx:(Math.random()-.5)*5,vy:(Math.random()-1)*5,r:4,color:d.color,life:30});
          document.getElementById('dropsDisplay').textContent=drops;
          return false;
        }
        return d.x > -20;
      });

      // Particles
      particles = particles.filter(p => { p.x+=p.vx;p.y+=p.vy;p.life--;p.r*=0.92; return p.life>0; });

      score++;
      document.getElementById('scoreDisplay').textContent=score;
    }

    function rectsOverlap(a, o) {
      return a.x+8 < o.x+o.w && a.x+a.w-8 > o.x && a.y-a.h+6 < o.y+o.h && a.y > o.y+4;
    }

    function draw() {
      ctx.clearRect(0,0,W,H);

      // Sky gradient
      const sky = ctx.createLinearGradient(0,0,0,H);
      sky.addColorStop(0,'#0d0a1e'); sky.addColorStop(1,'#13102a');
      ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

      // Stars
      ctx.fillStyle='rgba(255,255,255,0.5)';
      [20,60,120,180,240,300,400,500,600,700].forEach((x,i)=>{
        ctx.beginPath(); ctx.arc(x,(i%3)*30+10,1,0,Math.PI*2); ctx.fill();
      });

      // Ground
      ctx.fillStyle='#1a1538';
      ctx.fillRect(0,GROUND+dino.h,W,H-GROUND-dino.h);
      ctx.strokeStyle='rgba(100,70,220,0.3)';
      ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(0,GROUND+dino.h); ctx.lineTo(W,GROUND+dino.h); ctx.stroke();

      // Obstacles (rocks)
      obstacles.forEach(o=>{
        ctx.fillStyle='#2a1f45';
        ctx.strokeStyle='rgba(187,102,255,0.4)';
        ctx.lineWidth=1.5;
        roundRect(ctx,o.x,o.y,o.w,o.h,6);
        ctx.fill(); ctx.stroke();
      });

      // Drops
      colorDrops.forEach(d=>{
        ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
        ctx.fillStyle=d.color;
        ctx.shadowColor=d.color; ctx.shadowBlur=12;
        ctx.fill();
        ctx.shadowBlur=0;
      });

      // Particles
      particles.forEach(p=>{
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=p.color+'cc'; ctx.fill();
      });

      // Dino (text emoji + body)
      ctx.font = `${dino.h}px serif`;
      ctx.textAlign='center'; ctx.textBaseline='bottom';
      ctx.shadowColor='rgba(51,170,255,0.6)'; ctx.shadowBlur=16;
      ctx.fillText('🦖', dino.x+dino.w/2, dino.y);
      ctx.shadowBlur=0;
    }

    function roundRect(ctx,x,y,w,h,r){
      ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
      ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);
      ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);
      ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);
      ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
    }

    function gameOver() {
      running=false;
      if (score > best) { best=score; document.getElementById('bestDisplay').textContent=best; }
      const ov = document.getElementById('overlay');
      ov.style.display='flex';
      ov.innerHTML=`<h2>🦖 Game Over</h2>
        <p>Score: <b style="color:var(--gold)">${score}</b> · Drops: <b style="color:var(--blue)">${drops}</b></p>
        <button class="btn" onclick="startGame()">▶ Run Again</button>`;
    }
  </script>
</body>
</html>
