<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creature Match — Nara's Colour Quest</title>
  <style>
    :root{--paper:#080612;--card:#13102a;--card-2:#1a1538;--ink:#e8d4b8;--ink-dim:#7a6a8a;
      --border:rgba(100,70,220,0.28);--blue:#33aaff;--gold:#ffcc44;--purple:#bb66ff;--moss:#44dd88}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100vh;background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
      background-image:radial-gradient(1px 1px at 15% 20%,rgba(255,255,255,.5),transparent),
        radial-gradient(1px 1px at 70% 10%,rgba(255,204,68,.6),transparent),
        radial-gradient(1px 1px at 40% 80%,rgba(187,102,255,.5),transparent),
        radial-gradient(1px 1px at 85% 60%,rgba(255,255,255,.4),transparent)}
    .shell{max-width:700px;margin:0 auto;padding:20px 16px 48px;position:relative;z-index:1}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 0 24px}
    .brand{text-decoration:none;font-weight:900;color:var(--blue);font-size:13px;
      text-shadow:0 0 12px rgba(51,170,255,.5)}
    .kicker{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--purple);
      text-transform:uppercase;text-shadow:0 0 12px rgba(187,102,255,.4);margin-bottom:8px}
    h1{font-size:clamp(36px,8vw,72px);letter-spacing:-.06em;line-height:.9;margin-bottom:8px}
    .meta{display:flex;gap:16px;margin:12px 0 24px;font-size:14px;font-weight:700;color:var(--ink-dim)}
    .meta span b{color:var(--gold)}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:560px;margin:0 auto}
    .card{aspect-ratio:1;border-radius:16px;cursor:pointer;perspective:600px;
      position:relative;transform-style:preserve-3d}
    .card-face{position:absolute;inset:0;border-radius:14px;
      display:grid;place-items:center;font-size:clamp(28px,6vw,44px);
      backface-visibility:hidden;transition:transform .45s cubic-bezier(.4,0,.2,1)}
    .card-back{background:var(--card-2);border:1.5px solid var(--border);
      box-shadow:0 4px 20px rgba(0,0,0,.6)}
    .card-back::after{content:"✦";font-size:28px;color:rgba(187,102,255,.4)}
    .card-front{background:var(--card);border:1.5px solid rgba(51,170,255,.3);
      transform:rotateY(180deg);box-shadow:0 0 20px rgba(51,170,255,.1)}
    .card.flipped .card-back{transform:rotateY(180deg)}
    .card.flipped .card-front{transform:rotateY(0deg)}
    .card.matched .card-front{
      border-color:var(--moss);box-shadow:0 0 20px rgba(68,221,136,.3);
      background:rgba(68,221,136,.08)}
    .card.matched .card-back{transform:rotateY(180deg)}
    .card:hover:not(.flipped):not(.matched){transform:scale(1.04)}
    .win-banner{display:none;text-align:center;padding:24px;
      border:1.5px solid var(--gold);border-radius:20px;background:rgba(255,204,68,.08);
      box-shadow:0 0 30px rgba(255,204,68,.2);margin-top:24px}
    .win-banner h2{font-size:42px;color:var(--gold);text-shadow:0 0 20px rgba(255,204,68,.4);margin-bottom:8px}
    .win-banner.show{display:block;animation:popIn .4s ease}
    @keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
    .btn{padding:12px 24px;border-radius:999px;border:1.5px solid var(--purple);
      background:rgba(187,102,255,.1);color:var(--purple);font-weight:900;cursor:pointer;
      font-size:14px;font-family:inherit;transition:box-shadow .15s;margin-top:14px}
    .btn:hover{box-shadow:0 0 18px rgba(187,102,255,.4)}
  </style>
  <link rel="stylesheet" href="../../css/game.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="../../index.html">← Home</a>
    </header>
    <p class="kicker">Baby B$S · Memory Game</p>
    <h1>Creature Match</h1>
    <div class="meta">
      <span>Moves: <b id="moves">0</b></span>
      <span>Pairs: <b id="pairs">0</b>/8</span>
      <span>Time: <b id="timer">0</b>s</span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="win-banner" id="win">
      <h2>🎉 You did it!</h2>
      <p style="color:var(--ink-dim);font-weight:700">All creatures matched in <b id="win-moves" style="color:var(--gold)">0</b> moves</p>
      <button class="btn" onclick="startGame()">Play Again</button>
    </div>
  </div>
  <script>
    const CREATURES = ['🦖','🐍','🦜','🌸','🦋','🦎','🐉','⭐'];
    let deck=[], flipped=[], matched=0, moves=0, timer=0, interval=null, locked=false;

    function startGame() {
      deck = [...CREATURES,...CREATURES].sort(()=>Math.random()-.5);
      flipped=[]; matched=0; moves=0; timer=0; locked=false;
      clearInterval(interval);
      interval = setInterval(()=>{ timer++; document.getElementById('timer').textContent=timer; }, 1000);
      document.getElementById('moves').textContent=0;
      document.getElementById('pairs').textContent=0;
      document.getElementById('win').classList.remove('show');
      render();
    }

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = deck.map((c,i)=>`
        <div class="card" id="c${i}" onclick="flip(${i})">
          <div class="card-face card-back"></div>
          <div class="card-face card-front">${c}</div>
        </div>`).join('');
    }

    function flip(i) {
      if (locked || flipped.includes(i) || document.getElementById('c'+i).classList.contains('matched')) return;
      flipped.push(i);
      document.getElementById('c'+i).classList.add('flipped');
      if (flipped.length === 2) {
        locked = true;
        moves++;
        document.getElementById('moves').textContent = moves;
        setTimeout(check, 700);
      }
    }

    function check() {
      const [a,b] = flipped;
      if (deck[a] === deck[b]) {
        document.getElementById('c'+a).classList.add('matched');
        document.getElementById('c'+b).classList.add('matched');
        matched++;
        document.getElementById('pairs').textContent = matched;
        if (matched === CREATURES.length) win();
      } else {
        document.getElementById('c'+a).classList.remove('flipped');
        document.getElementById('c'+b).classList.remove('flipped');
      }
      flipped = []; locked = false;
    }

    function win() {
      clearInterval(interval);
      document.getElementById('win-moves').textContent = moves;
      document.getElementById('win').classList.add('show');
    }

    startGame();
  </script>
</body>
</html>
