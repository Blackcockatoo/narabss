<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feather Catcher — Nara's Colour Quest</title>
  <style>
    :root{--paper:#080612;--card:#13102a;--ink:#e8d4b8;--ink-dim:#7a6a8a;
      --border:rgba(100,70,220,0.28);--blue:#33aaff;--gold:#ffcc44;--purple:#bb66ff}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100vh;background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif}
    .shell{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 0 18px}
    .brand{text-decoration:none;font-weight:900;color:var(--blue);font-size:13px}
    .kicker{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--purple);text-transform:uppercase;margin-bottom:6px}
    h1{font-size:clamp(30px,6vw,56px);letter-spacing:-.06em;line-height:.9;margin-bottom:14px}
    .score-row{display:flex;gap:20px;margin-bottom:12px;font-weight:800;font-size:15px;color:var(--ink-dim)}
    .score-row b{color:var(--gold)}
    .game-wrap{position:relative;border:1.5px solid var(--border);border-radius:18px;overflow:hidden;
      box-shadow:0 0 40px rgba(0,0,0,.8);touch-action:none}
    canvas{display:block;width:100%;height:auto}
    .overlay{position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:14px;background:rgba(8,6,18,.88)}
    .overlay h2{font-size:clamp(26px,5vw,48px);letter-spacing:-.05em;color:var(--purple);
      text-shadow:0 0 24px rgba(187,102,255,.6)}
    .overlay p{color:var(--ink-dim);font-weight:700;font-size:14px;text-align:center;line-height:1.6}
    .btn{padding:12px 28px;border-radius:999px;border:1.5px solid var(--purple);
      background:rgba(187,102,255,.1);color:var(--purple);font-weight:900;cursor:pointer;
      font-size:15px;font-family:inherit;transition:box-shadow .15s}
    .btn:hover{box-shadow:0 0 22px rgba(187,102,255,.5)}
    .controls{text-align:center;margin-top:12px;font-size:13px;color:var(--ink-dim);font-weight:700}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="../../index.html">← Home</a>
    </header>
    <p class="kicker">Baby B$S · Calm Mode</p>
    <h1>Feather Catcher</h1>
    <div class="score-row">
      <span>Collected <b id="scoreDisplay">0</b></span>
      <span>Golden <b id="goldenDisplay">0</b></span>
      <span>Combo <b id="comboDisplay">0</b>x</span>
    </div>
    <div class="game-wrap">
      <canvas id="c" width="680" height="420"></canvas>
      <div class="overlay" id="overlay">
        <h2>🪶 Feather Catcher</h2>
        <p>Catch falling feathers · No losing<br>Just collecting · Just calm<br><br>Mouse · Touch to move</p>
        <button class="btn" onclick="startGame()">▶ Start Catching</button>
      </div>
    </div>
    <p class="controls">Move your mouse or touch screen · No way to lose — just enjoy</p>
  </div>
  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    const W=680, H=420, FLOOR=H-30;
    const BASKET_W=80, BASKET_H=36;

    let basket, feathers, particles, score, golden, combo, lastCatch, frame, running;
    const FEATHER_TYPES=[
      {e:'🪶',color:'#ffcc44',rare:false},
      {e:'🪶',color:'#33aaff',rare:false},
      {e:'🪶',color:'#bb66ff',rare:false},
      {e:'✨',color:'#ffcc44',rare:true},
      {e:'⭐',color:'#ffcc44',rare:true},
    ];

    function init() {
      basket={x:W/2-BASKET_W/2, targetX:W/2-BASKET_W/2};
      feathers=[]; particles=[]; score=0; golden=0; combo=0; lastCatch=0; frame=0;
      document.getElementById('scoreDisplay').textContent=0;
      document.getElementById('goldenDisplay').textContent=0;
      document.getElementById('comboDisplay').textContent=0;
    }

    function startGame() {
      document.getElementById('overlay').style.display='none';
      init(); running=true; requestAnimationFrame(loop);
    }

    c.addEventListener('mousemove', e=>{
      const r=c.getBoundingClientRect();
      basket.targetX=(e.clientX-r.left)*(W/r.width)-BASKET_W/2;
    });
    c.addEventListener('touchmove', e=>{
      e.preventDefault();
      const r=c.getBoundingClientRect();
      basket.targetX=(e.touches[0].clientX-r.left)*(W/r.width)-BASKET_W/2;
    },{passive:false});
    c.addEventListener('click', ()=>{ if(!running) startGame(); });

    function loop() {
      if (!running) return;
      frame++;
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function update() {
      // Smooth basket
      basket.x += (basket.targetX - basket.x) * 0.15;
      basket.x = Math.max(0, Math.min(W-BASKET_W, basket.x));

      // Spawn feathers (rate increases gently)
      const spawnRate = Math.max(30, 70 - Math.floor(score/8));
      if (frame % spawnRate === 0) {
        const type = Math.random() < 0.08 ? FEATHER_TYPES[3+Math.floor(Math.random()*2)] : FEATHER_TYPES[Math.floor(Math.random()*3)];
        feathers.push({
          x:20+Math.random()*(W-40), y:-20,
          vy:0.8+Math.random()*1.2,
          sway:Math.random()*Math.PI*2,
          swaySpeed:0.02+Math.random()*0.02,
          ...type, scale:0.8+Math.random()*0.4
        });
      }

      // Move feathers
      feathers = feathers.filter(f=>{
        f.sway += f.swaySpeed;
        f.x += Math.sin(f.sway)*1.2;
        f.y += f.vy;

        // Catch
        const bx=basket.x, by=FLOOR-BASKET_H;
        if (f.y+10>by && f.y<FLOOR && f.x>bx-5 && f.x<bx+BASKET_W+5) {
          score++;
          if (f.rare) { golden++; document.getElementById('goldenDisplay').textContent=golden; }
          const now=frame;
          combo = (now-lastCatch)<60 ? combo+1 : 1;
          lastCatch=now;
          document.getElementById('scoreDisplay').textContent=score;
          document.getElementById('comboDisplay').textContent=combo;
          for(let i=0;i<8;i++) particles.push({
            x:f.x,y:f.y, vx:(Math.random()-.5)*5,vy:(Math.random()-1.5)*4,
            r:3+Math.random()*4, color:f.color, life:40
          });
          return false;
        }
        return f.y < H+30;
      });

      particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life--;p.r*=0.94; return p.life>0;});
    }

    function draw() {
      ctx.clearRect(0,0,W,H);
      // Night sky
      const sky=ctx.createLinearGradient(0,0,0,H);
      sky.addColorStop(0,'#060410'); sky.addColorStop(1,'#0f0a22');
      ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

      // Stars
      ctx.fillStyle='rgba(255,255,255,0.5)';
      [50,130,220,340,460,600,80,250,400,550].forEach((x,i)=>{
        const y=(i%5+1)*28+5;
        ctx.beginPath(); ctx.arc(x,y,0.8+Math.random()*0.5,0,Math.PI*2); ctx.fill();
      });

      // Moon
      ctx.fillStyle='rgba(255,240,180,0.06)';
      ctx.beginPath(); ctx.arc(W-60,50,35,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(255,240,180,0.1)';
      ctx.beginPath(); ctx.arc(W-60,50,22,0,Math.PI*2); ctx.fill();

      // Floor
      ctx.fillStyle='rgba(20,16,40,0.7)'; ctx.fillRect(0,FLOOR,W,H-FLOOR);
      ctx.strokeStyle='rgba(187,102,255,0.25)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(0,FLOOR); ctx.lineTo(W,FLOOR); ctx.stroke();

      // Feathers
      feathers.forEach(f=>{
        ctx.save();
        ctx.font=`${Math.round(28*f.scale)}px serif`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.shadowColor=f.color; ctx.shadowBlur=f.rare?18:6;
        ctx.translate(f.x,f.y);
        ctx.rotate(Math.sin(f.sway)*0.3);
        ctx.fillText(f.e,0,0);
        ctx.restore();
        ctx.shadowBlur=0;
      });

      // Particles
      particles.forEach(p=>{
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=p.color+'aa'; ctx.fill();
      });

      // Basket
      ctx.save();
      ctx.strokeStyle='rgba(187,102,255,0.6)'; ctx.lineWidth=2.5;
      ctx.fillStyle='rgba(40,20,80,0.7)';
      ctx.beginPath();
      ctx.roundRect(basket.x, FLOOR-BASKET_H, BASKET_W, BASKET_H, [0,0,8,8]);
      ctx.fill(); ctx.stroke();
      // Basket glow
      ctx.shadowColor='rgba(187,102,255,0.4)'; ctx.shadowBlur=12;
      ctx.stroke(); ctx.shadowBlur=0;
      // Basket text
      ctx.font='22px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🧺', basket.x+BASKET_W/2, FLOOR-BASKET_H/2);
      ctx.restore();

      // Combo display
      if (combo>1) {
        ctx.font=`bold ${14+combo*2}px system-ui`;
        ctx.fillStyle=`rgba(255,204,68,${Math.min(1,combo*0.15)})`;
        ctx.textAlign='center';
        ctx.fillText(`${combo}x combo!`, basket.x+BASKET_W/2, FLOOR-BASKET_H-18);
      }
    }
  </script>
</body>
</html>
