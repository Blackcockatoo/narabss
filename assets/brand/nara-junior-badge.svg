<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Nara Junior B$S Badge</title>
  <desc id="desc">A kid-safe Blue Snake Studios Junior badge with a blue snake, gold star and Nara wordmark.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#173a72"/>
      <stop offset="0.55" stop-color="#07162e"/>
      <stop offset="1" stop-color="#020714"/>
    </radialGradient>
    <linearGradient id="snake" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#5be7ff"/>
      <stop offset="0.45" stop-color="#2a7dff"/>
      <stop offset="1" stop-color="#bb66ff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#ffef9a"/>
      <stop offset="0.48" stop-color="#ffcc44"/>
      <stop offset="1" stop-color="#b97721"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="600" cy="600" r="560" fill="url(#bg)"/>
  <circle cx="600" cy="600" r="520" fill="none" stroke="url(#gold)" stroke-width="18"/>
  <circle cx="600" cy="600" r="468" fill="none" stroke="#33aaff" stroke-opacity="0.36" stroke-width="6" stroke-dasharray="18 20"/>
  <path d="M233 643c122-168 292-211 408-156 78 37 126 106 98 171-24 55-90 77-154 52-57-22-83-78-57-119 22-35 73-37 101-9" fill="none" stroke="url(#snake)" stroke-width="82" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M749 504c92-16 173 21 219 94" fill="none" stroke="url(#snake)" stroke-width="82" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="921" cy="586" r="54" fill="url(#snake)"/>
  <circle cx="936" cy="570" r="10" fill="#fff"/>
  <path d="M600 155l27 84 88-1-72 51 29 84-72-52-72 52 29-84-72-51 88 1z" fill="url(#gold)" filter="url(#glow)"/>
  <text x="600" y="835" text-anchor="middle" font-family="Arial Black, system-ui, sans-serif" font-size="150" fill="#f7e9c0" letter-spacing="8">NARA</text>
  <text x="600" y="918" text-anchor="middle" font-family="Arial, system-ui, sans-serif" font-size="45" font-weight="900" fill="#7feaff" letter-spacing="11">BLUE SNAKE STUDIOS JUNIOR</text>
  <text x="600" y="1010" text-anchor="middle" font-family="Arial Black, system-ui, sans-serif" font-size="72" fill="url(#gold)" letter-spacing="10">B$S JR</text>
</svg>
